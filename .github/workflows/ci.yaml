name: CI Docker Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r backend/requirements.txt

      - name: Vérifier Python
        run: |
          python -m py_compile backend/app.py


  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-frontend:latest \
            ./frontend

      - name: Construire Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-backend:latest \
            ./backend

      - name: Publier Frontend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-frontend:latest

      - name: Publier Backend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-backend:latest
